# Canonical caller — every knob lives in /hanzo.yml, none here.
#
# arm64, because `hanzo-agent` is one `py3-none-any` wheel: nothing this repo
# publishes is a function of the machine that built it, so it asks for the label
# this org has capacity on rather than the pipeline's amd64 default.
name: CI/CD
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  cicd:
    uses: hanzoai/ci/.github/workflows/build.yml@v2
    with:
      runner: '["linux-arm64"]'
    secrets: inherit
