# Canonical caller — every knob lives in /hanzo.yml, none here.
#
# TWO ARTIFACTS, TWO TAG NAMESPACES. `v*` belongs to the Go module: Go reads
# github.com/hanzoai/agent@v1.0.8 off the tag itself, and the sumdb makes every
# one of them immutable, so `v0.1.1` is spoken for and cannot be reused for a
# wheel. The distribution is named instead — `hanzo-agent-v0.1.1` — which is the
# shape hanzoai/ci matches against each pyproject's own [project] name.
#
# arm64, because `hanzo-agent` is one py3-none-any wheel: nothing this repo
# publishes is a function of the machine that built it, so it asks for the label
# this org has capacity on rather than the pipeline's amd64 default.
name: CI/CD
on:
  push:
    branches: [main]
    tags: ['v*', 'hanzo-agent-*']
  pull_request:
  workflow_dispatch:
jobs:
  cicd:
    uses: hanzoai/ci/.github/workflows/build.yml@v2
    with:
      runner: '["linux-arm64"]'
    secrets: inherit
