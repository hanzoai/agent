# Builds and pushes ghcr.io/hanzoai/agent. Nothing else.
#
# This is .github/workflows/docker-publish.yml restored here: it was the sole
# producer of this image and was deleted with no replacement, which is exactly
# how an artifact goes stale with no failing run to show it.
#
# Two things could not come across verbatim.
#
# 1. Its body was one `uses: hanzoai/.github/.github/workflows/docker-build.yml@main`,
#    and a private cross-repo reusable workflow does not resolve on the forge, so
#    the amd64 build/push it performed is vendored inline, the way hanzoai/bot
#    already vendors it.
# 2. It built `context: control-plane`, and no control-plane directory exists on
#    main — the orchestrator was hoisted into the root module (tag v0.1.1, "drop
#    control-plane/pkg nesting"); the directory survives only on the unmerged
#    consolidate/held-work branch, and deployments/docker/Dockerfile.control-plane
#    still COPYs from it. Restoring that context restores a build that cannot
#    run. This builds Dockerfile.sdk, the one Dockerfile on main whose context
#    exists, and tags it sdk-* to match what is already published here.
#
# No deploy step: the tag that runs is named by a CR in hanzoai/universe, not by
# CI. Nothing in universe references this image yet — see LLM.md.
name: deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    # The forge's git-runner advertises this label (GIT_RUNNER_LABELS in
    # universe infra/k8s/git-runner/statefulset.yaml). A label nothing
    # advertises does not fail — it queues to the timeout, which is silence.
    runs-on: [linux-amd64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Computed here rather than by docker/metadata-action: the rule is two
      # lines of shell, and shell is the same on both forges. The sdk- prefix
      # keeps this Dockerfile's tags from colliding with any other image built
      # out of this repo.
      #   v* tag    -> :sdk-X.Y.Z     + :sdk-latest
      #   main push -> :sdk-sha-<sha7> + :sdk-latest
      - id: tags
        run: |
          set -euo pipefail
          image=ghcr.io/hanzoai/agent
          case "${GITHUB_REF}" in
            refs/tags/v*) primary="${image}:sdk-${GITHUB_REF#refs/tags/v}" ;;
            *)            primary="${image}:sdk-sha-$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)" ;;
          esac
          {
            echo 'list<<EOF'
            echo "${primary}"
            echo "${image}:sdk-latest"
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"
          echo "publishing ${primary} and ${image}:sdk-latest"

      # binfmt, so this amd64 runner can emit the arm64 half of the image.
      # Without the registration the arm64 leg dies on `exec format error`
      # inside the first RUN.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: network=host

      # Without this the push is unauthenticated and the registry 403s.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.sdk
          # The lab runs both architectures, and a single-platform image does
          # not start on half of it. A manifest list cannot be `load`ed into a
          # local daemon, so this only works because the build pushes.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.list }}
          provenance: false
          push: true

      # build-push-action can exit 0 before the manifest resolves, so a green
      # run could still mean a later ImagePullBackOff. Prove it pulls.
      - name: the pushed image resolves
        # `list` is one tag per line, which is what build-push-action wants. Fed
        # to a `for` word list it lands as a bare newline mid-statement and bash
        # never reaches the loop body — so this step failed on its own syntax
        # while the images it was meant to check were pushed fine. Read it a
        # line at a time, through the environment rather than interpolated into
        # the script.
        env:
          TAGS: ${{ steps.tags.outputs.list }}
        run: |
          set -euo pipefail
          while IFS= read -r img; do
            [ -n "${img}" ] || continue
            for i in 1 2 3 4 5 6; do
              # The platforms are read here, not just the existence of the tag:
              # a manifest list carrying one architecture pulls fine on the
              # machine that built it and fails everywhere else, which is the
              # state this build is leaving.
              if got=$(docker buildx imagetools inspect "${img}" \
                         --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}' 2>/dev/null); then
                echo "resolved ${img} -> ${got}"
                for want in linux/amd64 linux/arm64; do
                  case " ${got} " in
                    *" ${want} "*) ;;
                    *) echo "::error::${img} does not carry ${want}"; exit 1 ;;
                  esac
                done
                break
              fi
              if [ "${i}" = 6 ]; then
                echo "::error::pushed image never resolved: ${img}"
                exit 1
              fi
              sleep 5
            done
          done <<< "${TAGS}"
